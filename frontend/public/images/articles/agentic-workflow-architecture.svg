<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Agentic workflow architecture</title>
  <desc id="description">A user request enters a LangGraph workflow. An agent node uses a language model, memory, and tools, then an evaluation node either returns an answer or loops back for another tool call.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b35"/>
      <stop offset="1" stop-color="#481cab"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#09031a" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#77e1c2"/>
    </marker>
    <style>
      .card { fill: #fff; stroke: #cfc3ef; stroke-width: 3; filter: url(#shadow); }
      .core { fill: #f4efff; stroke: #9d7ce8; stroke-width: 4; filter: url(#shadow); }
      .label { font: 700 29px system-ui, -apple-system, sans-serif; fill: #261255; text-anchor: middle; }
      .small { font: 500 20px system-ui, -apple-system, sans-serif; fill: #59477e; text-anchor: middle; }
      .flow { fill: none; stroke: #77e1c2; stroke-width: 7; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #f7bd55; stroke-width: 6; stroke-dasharray: 14 12; marker-end: url(#arrow); }
      .flow-label { font: 700 18px system-ui, -apple-system, sans-serif; fill: #fff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#background)"/>
  <text x="800" y="75" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" text-anchor="middle">An Agent Is a System, Not Just a Model</text>
  <text x="800" y="116" fill="#d8cdf6" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle">LangGraph coordinates state, decisions, tool calls, and stopping conditions</text>

  <rect class="card" x="65" y="332" width="225" height="150" rx="28"/>
  <text class="label" x="177" y="395">User</text>
  <text class="small" x="177" y="432">request</text>

  <rect class="core" x="405" y="220" width="660" height="390" rx="42"/>
  <text class="label" x="735" y="275">LangGraph workflow</text>

  <rect class="card" x="455" y="325" width="210" height="145" rx="24"/>
  <text class="label" x="560" y="385">Agent</text>
  <text class="small" x="560" y="423">reason + route</text>

  <rect class="card" x="805" y="325" width="210" height="145" rx="24"/>
  <text class="label" x="910" y="385">Evaluate</text>
  <text class="small" x="910" y="423">done or continue?</text>

  <rect class="card" x="345" y="690" width="245" height="135" rx="26"/>
  <text class="label" x="467" y="747">Model</text>
  <text class="small" x="467" y="783">reasoning engine</text>

  <rect class="card" x="675" y="690" width="245" height="135" rx="26"/>
  <text class="label" x="797" y="747">Memory</text>
  <text class="small" x="797" y="783">state + context</text>

  <rect class="card" x="1005" y="690" width="245" height="135" rx="26"/>
  <text class="label" x="1127" y="747">Tools</text>
  <text class="small" x="1127" y="783">data + actions</text>

  <rect class="card" x="1285" y="332" width="250" height="150" rx="28"/>
  <text class="label" x="1410" y="395">Answer</text>
  <text class="small" x="1410" y="432">or approved action</text>

  <path class="flow" d="M290 407 H405"/>
  <path class="flow" d="M665 397 H805"/>
  <path class="flow" d="M1065 407 H1285"/>
  <path class="flow" d="M560 470 V645 Q560 665 540 690"/>
  <path class="flow" d="M610 470 V610 Q610 650 735 690"/>
  <path class="flow" d="M660 470 V570 Q660 635 1065 690"/>
  <path class="loop" d="M910 325 V175 Q910 150 880 150 H560 Q525 150 525 220"/>

  <text class="flow-label" x="347" y="386">input</text>
  <text class="flow-label" x="735" y="376">state</text>
  <text class="flow-label" x="1174" y="386">finish</text>
  <text x="720" y="171" fill="#f7bd55" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" text-anchor="middle">another step is required</text>
</svg>
