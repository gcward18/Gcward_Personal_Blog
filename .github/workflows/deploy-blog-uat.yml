name: Deploy Curious Developer Blog UAT

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "stacks/blog_stack.py"
      - "lambda/publisher/**"
      - "lambda/assistant/**"
      - "lambda/linkedin/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/deploy-blog-uat.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: curious-developer-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy UAT
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deployment dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements.txt
          npm install --global aws-cdk

      - name: Validate UAT configuration
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          COGNITO_DOMAIN_PREFIX: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -Eeuo pipefail

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "::error::AWS_ACCOUNT_ID must be a 12-digit account ID."
            exit 1
          }

          expected_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/github-deployment-role"
          [[ "$AWS_DEPLOY_ROLE_ARN" == "$expected_role" ]] || {
            echo "::error::AWS_DEPLOY_ROLE_ARN does not match github-deployment-role."
            exit 1
          }

          [[ "$ACM_CERTIFICATE_ARN" == arn:aws:acm:us-east-1:"${AWS_ACCOUNT_ID}":certificate/* ]] || {
            echo "::error::ACM_CERTIFICATE_ARN must reference a us-east-1 certificate in the target account."
            exit 1
          }

          [[ -n "$COGNITO_DOMAIN_PREFIX" ]] || {
            echo "::error::COGNITO_DOMAIN_PREFIX is required for UAT."
            exit 1
          }

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: github-uat-${{ github.run_id }}
          retry-max-attempts: 2
          action-timeout-s: 60
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          set -Eeuo pipefail
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$arn" == arn:aws:sts::*:assumed-role/github-deployment-role/* ]] || {
            echo "::error::Unexpected assumed role."
            exit 1
          }

      - name: Deploy UAT
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          DEPLOYMENT_STAGE: uat
          DOMAIN_NAME: uat.thecuriousengineerblog.dev
          HOSTED_ZONE_NAME: thecuriousengineerblog.dev
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          GITHUB_OWNER: gcward18
          GITHUB_REPOSITORY: Gcward_Personal_Blog
          GITHUB_TOKEN_SECRET_NAME: curious-developer/github-token
          COGNITO_DOMAIN_PREFIX: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_ORGANIZATION_NAME: ${{ vars.LINKEDIN_ORGANIZATION_NAME }}
          LINKEDIN_CLIENT_SECRET_NAME: curious-developer/linkedin-client-secret
        run: |
          set -Eeuo pipefail
          cdk deploy BlogUatStack --require-approval never

      - name: Verify deployed Author Studio configuration
        env:
          BLOG_BASE_URL: https://uat.thecuriousengineerblog.dev
        run: |
          set -Eeuo pipefail
          python -m unittest tests.integration.test_author_config --verbose

      - name: Report UAT deployment failure
        if: failure()
        run: |
          echo "::error::UAT deployment failed. Check the preceding failed step."
          echo "The GitHub environment must be uat and the IAM trust policy must allow the uat OIDC subject."
