name: Test AWS OIDC Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -Eeuo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_ACCOUNT_ID must contain 12 digits."; exit 1; }
          expected="arn:aws:iam::${AWS_ACCOUNT_ID}:role/github-deployment-role"
          [[ "$AWS_DEPLOY_ROLE_ARN" == "$expected" ]] || { echo "::error::AWS_DEPLOY_ROLE_ARN does not match the expected role."; exit 1; }

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: github-oidc-test-${{ github.run_id }}
          retry-max-attempts: 2
          action-timeout-s: 60
          mask-aws-account-id: true

      - name: Verify Identity
        shell: bash
        run: |
          set -Eeuo pipefail
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$arn" == arn:aws:sts::*:assumed-role/github-deployment-role/* ]] || { echo "::error::Unexpected assumed role."; exit 1; }
          echo "OIDC authentication succeeded with github-deployment-role."

      - name: Failure guidance
        if: failure()
        run: |
          echo "::error::OIDC test failed. Check the preceding failed step."
          echo "The job environment must be production and the IAM trust policy must match GitHub's immutable subject exactly."
