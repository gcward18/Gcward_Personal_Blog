name: Deploy Curious Developer Blog

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "stacks/blog_stack.py"
      - "lambda/publisher/**"
      - "lambda/assistant/**"
      - "lambda/linkedin/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/deploy-blog.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: curious-developer-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deployment dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements.txt
          npm install --global aws-cdk

      - name: Validate AWS configuration
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EMAIL: ${{ vars.BUDGET_EMAIL }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must be a 12-digit account ID."
            exit 1
          fi

          expected_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/github-deployment-role"

          if [[ "$AWS_DEPLOY_ROLE_ARN" != "$expected_role" ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN does not match github-deployment-role."
            exit 1
          fi

          if [[ -z "$EMAIL" || "$EMAIL" != *@*.* ]]; then
            echo "::error::BUDGET_EMAIL is missing or is not a valid email address."
            echo "Add it as an Actions variable in the production environment."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: github-deploy-${{ github.run_id }}
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          set -Eeuo pipefail
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"
          echo "Successfully authenticated to AWS."
          echo "Identity: ${identity_arn}"

          if [[ "$identity_arn" != arn:aws:sts::*:assumed-role/github-deployment-role/* ]]; then
            echo "::error::Unexpected AWS identity."
            exit 1
          fi

      - name: Build and deploy approved content
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          EMAIL: ${{ vars.BUDGET_EMAIL }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          DOMAIN_NAME: thecuriousengineerblog.dev
          GITHUB_OWNER: gcward18
          GITHUB_REPOSITORY: Gcward_Personal_Blog
          GITHUB_TOKEN_SECRET_NAME: curious-developer/github-token
          COGNITO_DOMAIN_PREFIX: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_ORGANIZATION_NAME: ${{ vars.LINKEDIN_ORGANIZATION_NAME }}
          LINKEDIN_CLIENT_SECRET_NAME: curious-developer/linkedin-client-secret
        run: |
          set -Eeuo pipefail
          cdk deploy BlogStack --require-approval never

      - name: Report deployment failure
        if: failure()
        run: |
          echo "::error::Deployment failed."
          echo "If authentication failed, verify:"
          echo "1. This job uses environment: production."
          echo "2. The AWS trust policy contains the exact immutable OIDC subject."
          echo "3. AWS_DEPLOY_ROLE_ARN references github-deployment-role."
          echo "4. The GitHub production environment allows the main branch."
